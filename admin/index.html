<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PRTC Admin</title>
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="admin-login" id="loginView">
  <div class="login-card">
    <a href="/" class="admin-brand"><img src="/assets/prtc-header-light.png" alt="PRTC Group"></a>
    <p class="kicker">Secure administration</p>
    <h1>PRTC Admin</h1>
    <p class="muted">Sign in with an approved administrator account.</p>

    <label>Email
      <input id="loginEmail" type="email" autocomplete="username" required>
    </label>

    <label>Password
      <input id="loginPassword" type="password" autocomplete="current-password" required>
    </label>

    <button id="loginBtn" type="button" class="primary">Sign in</button>
    <p class="status" id="loginStatus" role="status">Ready to sign in.</p>
    <a class="back-link" href="/">← Back to website</a>
  </div>
</div>

<div class="admin-shell" id="adminView" hidden>
  <aside class="sidebar">
    <a href="/" class="admin-brand sidebar-brand"><img src="/assets/prtc-header-dark.png" alt="PRTC Group"></a>
    <nav>
      <button class="nav-btn is-active" type="button">Dashboard</button>
    </nav>
    <div class="sidebar-bottom">
      <span id="adminEmail"></span>
      <button id="logoutBtn" class="text-btn" type="button">Log out</button>
    </div>
  </aside>
  <main class="admin-main">
    <header class="admin-topbar">
      <div>
        <p class="kicker">PRTC Group</p>
        <h1>Dashboard</h1>
      </div>
    </header>
    <section class="admin-view is-active">
      <div class="panel">
        <div class="panel-head">
          <div>
            <p class="kicker">Secure access</p>
            <h2>Admin login successful</h2>
          </div>
        </div>
        <p id="dashboardMessage">Loading administrator data…</p>
      </div>
    </section>
  </main>
</div>

<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://sqeyjhedqufykqduvtcb.supabase.co';
  var API_KEY = 'sb_publishable_goNXOTguYIcivBwulGSf_g_KhY2iRYK';

  var loginView = document.getElementById('loginView');
  var adminView = document.getElementById('adminView');
  var emailInput = document.getElementById('loginEmail');
  var passwordInput = document.getElementById('loginPassword');
  var loginBtn = document.getElementById('loginBtn');
  var loginStatus = document.getElementById('loginStatus');
  var adminEmail = document.getElementById('adminEmail');
  var logoutBtn = document.getElementById('logoutBtn');
  var dashboardMessage = document.getElementById('dashboardMessage');

  function setStatus(message, isError) {
    loginStatus.textContent = message;
    loginStatus.className = isError ? 'status is-error' : 'status';
  }

  function saveSession(data) {
    localStorage.setItem('prtc_admin_session', JSON.stringify(data));
  }

  function clearSession() {
    localStorage.removeItem('prtc_admin_session');
  }

  function showDashboard(data) {
    loginView.hidden = true;
    adminView.hidden = false;
    adminEmail.textContent = data.user && data.user.email ? data.user.email : 'Admin';
    dashboardMessage.textContent = 'You are signed in as an approved PRTC administrator.';
  }

  function verifyAdmin(data) {
    var userId = data.user && data.user.id ? data.user.id : '';
    return fetch(
      SUPABASE_URL + '/rest/v1/admin_users?select=role&user_id=eq.' + encodeURIComponent(userId),
      {
        method: 'GET',
        headers: {
          'apikey': API_KEY,
          'Authorization': 'Bearer ' + data.access_token
        }
      }
    ).then(function (response) {
      if (!response.ok) {
        throw new Error('Could not verify administrator access.');
      }
      return response.json();
    }).then(function (rows) {
      if (!rows || !rows.length || rows[0].role !== 'admin') {
        throw new Error('This account is not approved as a PRTC administrator.');
      }
      return data;
    });
  }

  function login() {
    var email = emailInput.value.trim();
    var password = passwordInput.value;

    if (!email || !password) {
      setStatus('Enter your email and password.', true);
      return;
    }

    loginBtn.disabled = true;
    setStatus('Signing in…', false);

    fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: {
        'apikey': API_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        email: email,
        password: password
      })
    })
    .then(function (response) {
      return response.json().then(function (data) {
        if (!response.ok) {
          throw new Error(data.msg || data.message || data.error_description || 'Sign in failed.');
        }
        return data;
      });
    })
    .then(verifyAdmin)
    .then(function (data) {
      saveSession(data);
      setStatus('Signed in.', false);
      showDashboard(data);
    })
    .catch(function (error) {
      clearSession();
      setStatus(error && error.message ? error.message : 'Sign in failed.', true);
    })
    .finally(function () {
      loginBtn.disabled = false;
    });
  }

  loginBtn.addEventListener('click', login);
  passwordInput.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
      event.preventDefault();
      login();
    }
  });

  logoutBtn.addEventListener('click', function () {
    clearSession();
    location.reload();
  });

  try {
    var stored = JSON.parse(localStorage.getItem('prtc_admin_session') || 'null');
    if (stored && stored.access_token && stored.user) {
      verifyAdmin(stored).then(showDashboard).catch(function () {
        clearSession();
      });
    }
  } catch (e) {
    clearSession();
  }
})();
</script>
</body>
</html>
